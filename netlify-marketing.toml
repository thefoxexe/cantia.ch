# Config for the SEPARATE Netlify site that serves cantia.ch (marketing
# only) via a real static export — see app-marketing/README.md and
# scripts/build-marketing.mjs. Does not touch netlify.toml, which keeps
# building app.cantia.ch (and cantia.ch until DNS is cut over) exactly as
# it always has, from the same repo.
#
# To use this file: create a new Netlify site pointed at this same repo,
# then in that site's Site settings -> Build & deploy -> Continuous
# deployment -> "Netlify configuration file", set the path to
# netlify-marketing.toml so Netlify reads this instead of netlify.toml.
[build]
  command = "npm run build:marketing"
  publish = "dist-marketing"

[build.environment]
  NODE_VERSION = "22"

# expo export's "static" output already gives each route its own real HTML
# file (e.g. dist-marketing/solutions/devis.html), and Netlify resolves a
# path without an extension to "<path>.html" by default — so no per-route
# redirect list is needed here, unlike netlify.toml's "single" CSR build.
[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404
