<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Black Friday 2026 motion film. Night ground, one flame orange, huge type,
     numbers that fall. Every element is a function of time (window.frame),
     rendered image by image by render.js. */
  :root{--night:#121410;--night2:#1b1e18;--line:#2c3027;--flame:#ff5b1f;--paper:#f4f3e9;--fog:#a9ae9f}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;font-family:'DM Sans',sans-serif}
  .film{width:1080px;position:relative;overflow:hidden;margin:0 0 40px;background:var(--night);color:var(--paper)}
  .film.reel{height:1920px}
  .film.feed{height:1350px}
  .scene{position:absolute;inset:0;display:none}
  .center{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
  .serif{font-family:'DM Serif Display',serif;font-style:italic;font-weight:400}
  .flame{color:var(--flame)}

  /* ticker at the top */
  .ticker{position:absolute;left:0;right:0;top:0;height:86px;background:var(--flame);overflow:hidden;z-index:5}
  .ticker .track{position:absolute;top:0;left:0;white-space:nowrap;font-size:34px;font-weight:800;letter-spacing:.08em;line-height:86px;color:#fff}
  .progress{position:absolute;left:0;top:86px;height:6px;background:var(--paper);z-index:5}
  .grain{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.07;background-image:radial-gradient(rgba(255,255,255,.6) 1px,transparent 1px);background-size:5px 5px}
  .glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:-160px;background:radial-gradient(circle,rgba(255,91,31,.28),rgba(255,91,31,0) 62%);z-index:0}

  /* 1 · BLACK FRIDAY */
  .bf{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.05em;line-height:.86}
  .bf span{display:inline-block}
  .kicker{position:absolute;left:0;right:0;text-align:center;font-size:36px;font-weight:700;letter-spacing:.32em;color:var(--fog)}

  /* lines */
  .lines{position:absolute;left:90px;right:90px}
  .lines .ln{display:block;overflow:hidden;padding-bottom:.08em}
  .lines .ln > span{display:block}
  .h{font-size:118px;font-weight:600;letter-spacing:-.045em;line-height:1.0}
  .sub{font-size:52px;line-height:1.25;color:var(--fog);font-weight:500;letter-spacing:-.01em}

  /* price drop */
  .plan{position:absolute;left:0;right:0;text-align:center;font-size:44px;font-weight:800;letter-spacing:.3em;color:var(--fog)}
  .old{position:absolute;left:0;right:0;text-align:center;font-size:120px;font-weight:700;color:var(--fog);letter-spacing:-.04em}
  .old .num{position:relative;display:inline-block}
  .old .strike{position:absolute;left:-12px;top:52%;height:12px;background:var(--flame);border-radius:6px;transform-origin:left center}
  .new{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.06em;line-height:1;font-variant-numeric:tabular-nums}
  .new small{font-size:64px;font-weight:700;letter-spacing:-.01em;color:var(--fog);vertical-align:top;margin-right:14px;position:relative;top:40px}
  .new i{font-style:normal;font-size:56px;font-weight:600;letter-spacing:-.01em;color:var(--fog);margin-left:10px}
  .stamp{position:absolute;background:var(--flame);color:#fff;font-weight:800;border-radius:28px;padding:10px 34px;letter-spacing:-.03em;box-shadow:0 20px 60px rgba(255,91,31,.45)}
  .tag{position:absolute;left:0;right:0;text-align:center;font-size:56px;font-weight:600;letter-spacing:-.02em}

  /* two cards */
  .card{position:absolute;left:90px;right:90px;border:2px solid var(--line);background:var(--night2);border-radius:40px;padding:44px 54px}
  .card .row{display:flex;justify-content:space-between;align-items:center}
  .card .nm{font-size:54px;font-weight:700;letter-spacing:-.02em}
  .card .pct{background:var(--flame);color:#fff;font-size:50px;font-weight:800;border-radius:18px;padding:4px 20px}
  .card .was{font-size:44px;color:var(--fog);margin-top:22px}
  .card .was b{text-decoration:line-through;text-decoration-color:var(--flame);text-decoration-thickness:5px;font-weight:600}
  .card .now{font-size:150px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
  .card .now small{font-size:46px;color:var(--fog);font-weight:700;letter-spacing:0;margin-right:10px}
  .card .now i{font-style:normal;font-size:44px;color:var(--fog);font-weight:600;letter-spacing:0;margin-left:8px}

  /* à vie */
  .life{position:absolute;left:0;right:0;text-align:center;font-size:330px;line-height:.9;color:var(--flame)}
  .lock{position:absolute;left:50%;width:150px;height:170px;margin-left:-75px}
  .lock path,.lock rect{fill:none;stroke:var(--paper);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}

  /* the clock */
  .ring{position:absolute;left:50%;width:520px;height:520px;margin-left:-260px}
  .ring circle{fill:none;stroke-width:26}
  .ring .bg{stroke:var(--line)}
  .ring .fg{stroke:var(--flame);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
  .ringtxt{position:absolute;left:0;right:0;text-align:center}
  .ringtxt .d{font-size:84px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .ringtxt .t{font-size:40px;font-weight:600;color:var(--fog);margin-top:8px}

  /* end card */
  .logo{position:absolute;left:50%;height:96px;transform:translateX(-50%)}
  .cta{position:absolute;left:0;right:0;text-align:center;font-size:104px;font-weight:700;letter-spacing:-.045em;line-height:1.02}
  .url{position:absolute;left:50%;transform:translateX(-50%);background:var(--flame);color:#fff;font-size:52px;font-weight:800;border-radius:999px;padding:24px 56px;white-space:nowrap;letter-spacing:-.01em}
  .fine{position:absolute;left:0;right:0;text-align:center;font-size:36px;color:var(--fog);font-weight:600}
</style>
</head>
<body>

<script>
// Same film for both formats: positions are set from the centre of the frame.
const FORMATS = { reel: 1920, feed: 1350 };
const TICK = 'BLACK FRIDAY · JUSQU’À -54 % À VIE · FIN LUNDI À MINUIT · ';
function film(id, kind) {
  const H = FORMATS[kind];
  document.write(`
<section class="film ${kind}" id="${id}" data-h="${H}">
  <div class="glow"></div>
  <div class="ticker"><div class="track">${Array(8).fill(`<span>${TICK}</span>`).join('')}</div></div>
  <div class="progress"></div>

  <div class="scene s1">
    <div class="kicker">CANTIA · 2026</div>
    <div class="bf b1">${[...'BLACK'].map((c) => `<span>${c}</span>`).join('')}</div>
    <div class="bf b2 flame">${[...'FRIDAY'].map((c) => `<span>${c}</span>`).join('')}</div>
  </div>

  <div class="scene s2">
    <div class="lines">
      <span class="ln h"><span>Le premier</span></span>
      <span class="ln h"><span>Black Friday</span></span>
      <span class="ln h"><span>de Cantia.</span></span>
      <span class="ln h" style="margin-top:40px"><span class="serif flame">Et le plus fort</span></span>
      <span class="ln h"><span class="serif flame">qu’il y aura jamais.</span></span>
    </div>
  </div>

  <div class="scene s3">
    <div class="plan">ENTREPRISE</div>
    <div class="old"><span class="num">CHF 129<span class="strike"></span></span></div>
    <div class="new"><small>CHF</small><span class="v">129</span><i>/mois</i></div>
    <div class="stamp">-54%</div>
    <div class="tag">Tout Cantia. <span class="serif flame">À vie.</span></div>
  </div>

  <div class="scene s4">
    <div class="card c1"><div class="row"><div class="nm">Équipe</div><div class="pct">-43%</div></div>
      <div class="was">au lieu de <b>CHF 79</b></div><div class="now"><small>CHF</small><span class="v">79</span><i>/mois</i></div></div>
    <div class="card c2"><div class="row"><div class="nm">Essentiel</div><div class="pct">-36%</div></div>
      <div class="was">au lieu de <b>CHF 39</b></div><div class="now"><small>CHF</small><span class="v">39</span><i>/mois</i></div></div>
  </div>

  <div class="scene s5">
    <svg class="lock" viewBox="0 0 150 170"><path class="shackle" d="M35 78 V52 a40 40 0 0 1 80 0 V78"/><rect x="12" y="78" width="126" height="84" rx="20"/></svg>
    <div class="life serif">À vie.</div>
    <div class="lines s5l" style="text-align:center">
      <span class="ln sub"><span>Votre prix ne bougera plus.</span></span>
      <span class="ln sub"><span>Même quand nos tarifs augmenteront.</span></span>
    </div>
  </div>

  <div class="scene s6">
    <svg class="ring" viewBox="0 0 520 520"><circle class="bg" cx="260" cy="260" r="230"/><circle class="fg" cx="260" cy="260" r="230" pathLength="1" stroke-dasharray="1 1"/></svg>
    <div class="ringtxt"><div class="d">LUNDI</div><div class="t">30.11 · minuit</div></div>
    <div class="lines s6l" style="text-align:center">
      <span class="ln h" style="font-size:104px"><span>Après, c’est fini.</span></span>
      <span class="ln h" style="font-size:104px"><span class="serif flame">Pour toujours.</span></span>
    </div>
  </div>

  <div class="scene s7">
    <img class="logo" src="logo-on-dark.png">
    <div class="cta">Bloquez<br>votre prix.</div>
    <div class="url">cantia.ch/black-friday</div>
    <div class="fine">14 jours d’essai · Résiliable à tout moment</div>
  </div>
  <div class="grain"></div>
</section>`);
}
film('v-reel', 'reel');
film('v-feed', 'feed');
</script>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const expoOut = (x) => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x));
const backOut = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const seg = (t, a, b, ease = inOut) => ease(clamp((t - a) / (b - a)));

// scene windows [start, end]
const S = { s1: [0, 2.4], s2: [2.4, 4.8], s3: [4.8, 8.6], s4: [8.6, 11.2], s5: [11.2, 13.6], s6: [13.6, 16.0], s7: [16.0, 19.0] };
const DUR = 19.0;
const CUTS = [2.4, 4.8, 8.6, 11.2, 13.6, 16.0];

function show(F, name, t, fadeOut = true) {
  const [a, b] = S[name];
  const el = F.querySelector('.' + name);
  const vis = t >= a - 0.001 && t < b + (fadeOut ? 0.25 : 0);
  el.style.display = vis ? 'block' : 'none';
  el.style.opacity = fadeOut ? 1 - seg(t, b - 0.05, b + 0.25) : 1;
  return el;
}
function revealLines(el, t, a, step = 0.14) {
  el.querySelectorAll('.ln > span').forEach((s, i) => {
    const k = seg(t, a + i * step, a + i * step + 0.7, expoOut);
    s.style.transform = `translateY(${(1 - k) * 110}%)`;
  });
}
function count(from, to, k) { return Math.round(lerp(from, to, k)); }

function frame(id, t) {
  const F = document.getElementById(id);
  const H = +F.dataset.h, C = H / 2, tall = H > 1500;

  // global: ticker scroll, progress, glow drift
  const tr = F.querySelector('.track'), loop = tr.firstElementChild.offsetWidth || 1400;
  tr.style.transform = `translateX(${-(t * 140) % loop}px)`;
  F.querySelector('.progress').style.width = 1080 * clamp(t / 16.0) + 'px';
  const endK = seg(t, 15.9, 16.3);
  F.querySelector('.ticker').style.transform = `translateY(${-endK * 100}px)`;
  F.querySelector('.progress').style.opacity = 1 - endK;
  const g = F.querySelector('.glow');
  g.style.top = C - 700 + Math.sin(t * 0.6) * 120 + 'px';
  g.style.left = -160 + Math.cos(t * 0.45) * 140 + 'px';

  // 1 · BLACK FRIDAY, letters dropping
  {
    const el = show(F, 's1', t);
    const size = tall ? 250 : 220;
    const b1 = el.querySelector('.b1'), b2 = el.querySelector('.b2');
    b1.style.fontSize = b2.style.fontSize = size + 'px';
    b1.style.top = C - size * 0.95 + 'px';
    b2.style.top = C + size * 0.02 + 'px';
    [...b1.children, ...b2.children].forEach((s, i) => {
      const k = seg(t, 0.15 + i * 0.07, 0.15 + i * 0.07 + 0.55, backOut);
      s.style.transform = `translateY(${(1 - k) * -260}px) scale(${lerp(1.6, 1, clamp(k))})`;
      s.style.opacity = clamp(k * 3);
    });
    const z = seg(t, 1.6, 2.4);
    b1.style.transform = b2.style.transform = `scale(${1 + z * 0.12})`;
    const kk = el.querySelector('.kicker');
    kk.style.top = C - size * 0.95 - 110 + 'px';
    kk.style.opacity = seg(t, 0.9, 1.4);
    kk.style.letterSpacing = lerp(0.6, 0.32, seg(t, 0.9, 1.8, expoOut)) + 'em';
  }

  // 2 · the first, and the strongest
  {
    const el = show(F, 's2', t);
    const L = el.querySelector('.lines');
    L.style.top = C - (tall ? 380 : 330) + 'px';
    revealLines(el, t, 2.5);
    // second part appears a beat later
    el.querySelectorAll('.ln > span').forEach((s, i) => {
      if (i < 3) return;
      const k = seg(t, 3.45 + (i - 3) * 0.14, 3.45 + (i - 3) * 0.14 + 0.7, expoOut);
      s.style.transform = `translateY(${(1 - k) * 110}%)`;
    });
  }

  // 3 · 129 falls to 59
  {
    const el = show(F, 's3', t);
    const top = C - (tall ? 380 : 350);
    el.querySelector('.plan').style.top = top + 'px';
    el.querySelector('.plan').style.opacity = seg(t, 4.9, 5.3);
    const old = el.querySelector('.old');
    const o = seg(t, 5.0, 5.4, expoOut);
    old.style.top = top + 70 + 'px';
    old.style.opacity = o * lerp(1, 0.55, seg(t, 6.0, 6.4));
    old.style.transform = `scale(${lerp(1.4, 1, o) * lerp(1, 0.7, seg(t, 6.0, 6.5))})`;
    el.querySelector('.strike').style.width = 'calc(100% + 24px)';
    el.querySelector('.strike').style.transform = `scaleX(${seg(t, 5.5, 5.9)}) rotate(-4deg)`;
    const nw = el.querySelector('.new');
    const nk = seg(t, 5.8, 6.2, expoOut);
    nw.style.fontSize = (tall ? 330 : 290) + 'px';
    nw.style.top = top + 230 + 'px';
    nw.style.opacity = nk;
    nw.style.transform = `translateY(${(1 - nk) * 80}px)`;
    nw.querySelector('.v').textContent = count(129, 59, seg(t, 6.0, 7.0, expoOut));
    const st = el.querySelector('.stamp');
    const sk = seg(t, 7.0, 7.45, backOut);
    st.style.fontSize = (tall ? 120 : 104) + 'px';
    st.style.right = '110px';
    st.style.top = top + (tall ? 170 : 160) + 'px';
    st.style.opacity = clamp(sk * 4);
    st.style.transform = `rotate(${lerp(-40, -8, sk)}deg) scale(${lerp(2.4, 1, clamp(sk))})`;
    const tg = el.querySelector('.tag');
    tg.style.top = top + (tall ? 640 : 590) + 'px';
    const tk = seg(t, 7.5, 8.0, expoOut);
    tg.style.opacity = tk;
    tg.style.transform = `translateY(${(1 - tk) * 30}px)`;
  }

  // 4 · Équipe and Essentiel
  {
    const el = show(F, 's4', t);
    const gap = tall ? 60 : 36, ch = 420;
    const c1 = el.querySelector('.c1'), c2 = el.querySelector('.c2');
    c1.style.top = C - ch - gap / 2 + 'px';
    c2.style.top = C + gap / 2 + 'px';
    const k1 = seg(t, 8.7, 9.3, expoOut), k2 = seg(t, 8.95, 9.55, expoOut);
    c1.style.transform = `translateX(${(1 - k1) * -1100}px)`;
    c2.style.transform = `translateX(${(1 - k2) * 1100}px)`;
    c1.querySelector('.v').textContent = count(79, 45, seg(t, 9.4, 10.2, expoOut));
    c2.querySelector('.v').textContent = count(39, 25, seg(t, 9.65, 10.45, expoOut));
    [c1, c2].forEach((c, i) => {
      const p = c.querySelector('.pct'), k = seg(t, 10.1 + i * 0.25, 10.5 + i * 0.25, backOut);
      p.style.transform = `scale(${lerp(0, 1, k)}) rotate(${lerp(-30, -4, clamp(k))}deg)`;
    });
  }

  // 5 · À VIE
  {
    const el = show(F, 's5', t);
    const lk = el.querySelector('.lock');
    lk.style.top = C - (tall ? 470 : 420) + 'px';
    const a = seg(t, 11.3, 11.7, expoOut);
    lk.style.opacity = a;
    lk.style.transform = `scale(${lerp(0.6, 1, a)})`;
    // the shackle closes
    lk.querySelector('.shackle').style.transform = `translateY(${(1 - seg(t, 11.8, 12.1, backOut)) * -26}px)`;
    const life = el.querySelector('.life');
    life.style.top = C - (tall ? 250 : 220) + 'px';
    const lk2 = seg(t, 11.6, 12.1, backOut);
    life.style.opacity = clamp(lk2 * 3);
    life.style.transform = `scale(${lerp(1.5, 1, clamp(lk2))})`;
    const L = el.querySelector('.s5l');
    L.style.top = C + (tall ? 150 : 120) + 'px';
    revealLines(el, t, 12.2, 0.2);
  }

  // 6 · the clock empties
  {
    const el = show(F, 's6', t);
    const ring = el.querySelector('.ring');
    ring.style.top = C - (tall ? 560 : 500) + 'px';
    const rk = seg(t, 13.7, 14.1, expoOut);
    ring.style.opacity = rk;
    ring.style.transform = `scale(${lerp(0.8, 1, rk)})`;
    el.querySelector('.fg').style.strokeDashoffset = -seg(t, 13.9, 15.6, (x) => x) * 0.92;
    const rt = el.querySelector('.ringtxt');
    rt.style.top = C - (tall ? 560 : 500) + 190 + 'px';
    rt.style.opacity = seg(t, 14.0, 14.4);
    const L = el.querySelector('.s6l');
    L.style.left = '60px'; L.style.right = '60px';
    L.style.top = C + (tall ? 60 : 70) + 'px';
    revealLines(el, t, 14.5, 0.25);
  }

  // 7 · end card
  {
    const el = show(F, 's7', t, false);
    const y0 = C - (tall ? 360 : 380);
    const items = [['.logo', 16.1, y0], ['.cta', 16.3, y0 + 190], ['.url', 16.7, y0 + (tall ? 470 : 460)], ['.fine', 16.9, y0 + (tall ? 620 : 600)]];
    items.forEach(([sel, a, y]) => {
      const e = el.querySelector(sel), k = seg(t, a, a + 0.7, expoOut);
      e.style.top = y + 'px';
      e.style.opacity = k;
      e.style.translate = `0 ${(1 - k) * 40}px`;
    });
    // the pill breathes
    const u = el.querySelector('.url');
    u.style.scale = 1 + Math.sin(Math.max(0, t - 17.4) * 5) * 0.025 * seg(t, 17.4, 17.8);
  }
}

window.frame = frame;
window.durations = { 'v-reel': DUR, 'v-feed': DUR };
window.cuts = { 'v-reel': CUTS, 'v-feed': CUTS };
frame('v-reel', 7.6); frame('v-feed', 9.8);
</script>
</body>
</html>
