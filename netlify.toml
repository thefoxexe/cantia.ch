# END generated blog redirects

# Blog articles (French and German) are one dynamic route each
# ([slug].tsx, see app/blog/[slug].tsx and app/de/blog/[slug].tsx) rather
# than one file per article like the routes above, so a splat rule covers
# all of them instead of needing a new [[redirects]] entry per new post —
# adding an article only means a new file under lib/blog/posts/ (or
# posts-de/).
[[redirects]]
  from = "/blog/*"
  to = "/blog/:splat.html"
  status = 200

[[redirects]]
  from = "/de/blog/*"
  to = "/de/blog/:splat.html"
  status = 200

[[redirects]]
  from = "/it/blog/*"
  to = "/it/blog/:splat.html"
  status = 200

# Shared planning links: the client-rendered shell with a real 200 (link
# previews and some mail clients give up on a 404).
[[redirects]]
  from = "/planning-partage/*"
  to = "/app-shell.html"
  status = 200

# SPA fallback for every other route (the actual app, auth screens, etc.) —
# stays last so none of the explicit rules above are shadowed by it. status
# 404 (not 200): every route Google should ever see already matched one of
# the explicit rules above, so anything reaching this one is a genuinely
# dead/mistyped URL — app/+not-found.tsx renders its branded page either
# way, but a real 404 status here (not a "soft 404") is what tells Search
# Console this URL isn't meant to be indexed. Netlify serves app-shell.html
# (the client-rendered shell written by scripts/inject-seo-meta.mjs) with that status, so nothing breaks for a visitor or
# for app.cantia.ch's own client-side routes (that host is already
# excluded from indexing — see lib/appHost.ts's excludeAppHostFromIndexing
# — and a non-200 status on the initial document never stops a browser
# from rendering/hydrating it).
[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 404
