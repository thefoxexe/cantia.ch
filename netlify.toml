[build]
  command = "npx expo export -p web -c && node scripts/inject-seo-meta.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Netlify is supposed to serve a matching on-disk file (including a nested
# index.html for a "pretty" directory-style path) before ever consulting the
# redirects below — but that precedence has been unreliable in practice here,
# and the blanket "/* -> /index.html" catch-all at the bottom was winning for
# every route, so every page served the *home* page's index.html and thus its
# <title>/meta tags (see scripts/inject-seo-meta.mjs, which generates a
# distinct dist/<route>/index.html per public page). Listing each known route
# as its own explicit, higher-priority rule removes that ambiguity entirely:
# these are matched top-to-bottom, first match wins, so each one is served
# before the SPA catch-all ever gets a chance to apply. Keep this list in
# sync with the ROUTES array in scripts/inject-seo-meta.mjs.
[[redirects]]
  from = "/solutions/devis"
  to = "/solutions/devis/index.html"
  status = 200

[[redirects]]
  from = "/solutions/facturation"
  to = "/solutions/facturation/index.html"
  status = 200

[[redirects]]
  from = "/solutions/rapports-chantier"
  to = "/solutions/rapports-chantier/index.html"
  status = 200

[[redirects]]
  from = "/solutions/dictee-vocale"
  to = "/solutions/dictee-vocale/index.html"
  status = 200

[[redirects]]
  from = "/solutions/planning"
  to = "/solutions/planning/index.html"
  status = 200

[[redirects]]
  from = "/solutions/leves-metre"
  to = "/solutions/leves-metre/index.html"
  status = 200

[[redirects]]
  from = "/solutions/rentabilite"
  to = "/solutions/rentabilite/index.html"
  status = 200

[[redirects]]
  from = "/telechargement"
  to = "/telechargement/index.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales/index.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite/index.html"
  status = 200

# SPA fallback for every other route (the actual app, auth screens, etc.) —
# stays last so none of the explicit rules above are shadowed by it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
